#yaml-lanaguage-server: $schema="https://json.schemastore.org/commitlintrc.json"
extends:
  - "@commitlint/config-conventional"
rules:
  scope-enum:
    [2, "always", ["repo", "scripts", "task", "chezmoi", "docker", "nvim"]]
  type-enum:
    - 2
    - always
    - - feat
      - fix
      - docs
      - style
      - refactor
      - test
      - chore
      - revert
