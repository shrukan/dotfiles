# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  install:chezmoi:
    desc: "Install chezmoi via script"
    cmd: ./scripts/chezmoi.sh

  install:nvim:
    desc: "Install neovim from source via script"
    vars:
      VERSION: '{{.VERSION | default "stable"}}'
      INSTALL_PREFIX: '{{.INSTALL_PREFIX | default "/usr/local"}}'
    cmd: ./scripts/nvim.sh {{.INSTALL_PREFIX}} {{.VERSION}}

  install:prek:
    desc: "Install prek via script for handling pre-commit hooks"
    cmd: ./scripts/prek.sh

  install:alacritty:
    desc: "Install alacritty via script"
    cmd: ./scripts/alacritty.sh

  install:fonts:
    desc: "Install configured fonts (list in README.md)"
    cmd: ./scripts/fonts.sh

  install:nvim-deps:
    desc: "Install Neovim runtime dependencies"
    cmd: ./scripts/nvim-deps.sh

  install:zellij:
    desc: "Install zellij via script"
    cmd: ./scripts/zellij.sh

  install:all:
    desc: "Install all the dependencies via scripts"
    vars:
      VERSION: '{{.VERSION | default "stable"}}'
      INSTALL_PREFIX: '{{.INSTALL_PREFIX | default "/usr/local"}}'
    cmds:
      - task: install:alacritty
      - task: install:chezmoi
      - task: install:prek
      - task: install:zellij
      - task: install:nvim-deps
      - task: install:nvim
        vars:
          { VERSION: "{{.VERSION }}", INSTALL_PREFIX: "{{ .INSTALL_PREFIX }}" }
      - task: install:fonts

  uninstall:alacritty:
    desc: "Uninstall alacritty"
    cmd: ./scripts/alacritty.sh --uninstall

  uninstall:task:
    desc: "Uninstall task"
    cmd: ./scripts/task.sh --uninstall

  uninstall:chezmoi:
    desc: "Uninstall chezmoi"
    cmd: ./scripts/chezmoi.sh --uninstall

  uninstall:prek:
    desc: "Uninstall prek"
    cmd: ./scripts/prek.sh --uninstall

  uninstall:zellij:
    desc: "Uninstall zellij"
    cmd: ./scripts/zellij.sh --uninstall

  _chezmoi:
    internal: true
    cmd: chezmoi {{.CLI_ARGS}} --source="{{.ROOT_DIR}}"

  init:
    desc: "Initialize chezmoi for the first time or re-initialize (use with caution!)"
    cmds:
      - task: _chezmoi
        vars: { CLI_ARGS: "init" }

  apply:
    desc: "Apply dotfiles using chezmoi"
    cmds:
      - task: _chezmoi
        vars: { CLI_ARGS: "apply" }

  diff:
    desc: "Diff dotfiles using chezmoi"
    cmds:
      - task: _chezmoi
        vars: { CLI_ARGS: "diff" }

  add:
    desc: "Import a file or directory into source"
    requires:
      vars:
        - TARGET
    cmds:
      - task: _chezmoi
        vars:
          CLI_ARGS: "add {{.TARGET}}"

  add:nvim-lock:
    desc: "Re-import the Lazy lockfile after :Lazy update/sync changes it"
    cmds:
      - task: _chezmoi
        vars:
          CLI_ARGS: "add {{.HOME}}/.config/nvim/lazy-lock.json"

  docker:nvim:build:
    desc: "Build the Neovim Docker image (GO_VERSION=x.y.z to match your projects)"
    vars:
      GO_VERSION: '{{.GO_VERSION | default "1.27.3"}}'
    cmds:
      - task: _container
        vars:
          CLI_ARGS: build --build-arg GO_VERSION={{.GO_VERSION}} -t nvim-env -f nvim-docker/Dockerfile .

  docker:nvim:run:
    desc: "Run Neovim in the container (WORKSPACE=dir holding go.work, default: current dir)"
    cmds:
      - task: _nvim_container
        vars:
          CMD: nvim {{.CLI_ARGS}}
          WORKSPACE: "{{.WORKSPACE}}"
          NETWORK: "{{.NETWORK}}"

  docker:nvim:shell:
    desc: "Run a shell inside the Neovim container for debugging/exploration"
    cmds:
      - task: _nvim_container
        vars:
          CMD: /bin/bash
          WORKSPACE: "{{.WORKSPACE}}"
          NETWORK: "{{.NETWORK}}"

  docker:nvim:test-offline:
    desc: "Run Neovim in the container without network, as on the airgapped system"
    cmds:
      - task: _nvim_container
        vars:
          CMD: nvim {{.CLI_ARGS}}
          WORKSPACE: "{{.WORKSPACE}}"
          NETWORK: none

  docker:nvim:save:
    desc: "Export the image to nvim-env.tar.gz for the airgapped system"
    cmds:
      - task: _container
        vars:
          CLI_ARGS: save nvim-env | gzip > nvim-env.tar.gz

  docker:nvim:load:
    desc: "Import nvim-env.tar.gz on the airgapped system"
    cmds:
      - gunzip -c nvim-env.tar.gz | {{.ENGINE}} load
    vars:
      ENGINE:
        sh: command -v podman >/dev/null && echo podman || echo docker

  docker:nvim:modcache:
    desc: "Download every module of WORKSPACE and pack the Go module cache to gomodcache.tar.gz"
    requires:
      vars:
        - WORKSPACE
    vars:
      GOMODCACHE_HOST:
        sh: go env GOMODCACHE
    cmds:
      - cd "{{.WORKSPACE}}" && go mod download all
      - tar -czf gomodcache.tar.gz -C "{{.GOMODCACHE_HOST}}" .

  _container:
    internal: true
    vars:
      ENGINE:
        sh: command -v podman >/dev/null && echo podman || echo docker
    cmds:
      - "{{.ENGINE}} {{.CLI_ARGS}}"

  # The mounts and environment are documented in nvim-docker/run.sh.
  _nvim_container:
    internal: true
    dir: "{{.USER_WORKING_DIR}}"
    vars:
      WORKSPACE: '{{.WORKSPACE | default .USER_WORKING_DIR}}'
    cmds:
      - '"{{.ROOT_DIR}}/nvim-docker/run.sh" {{if eq .NETWORK "none"}}--offline{{end}} --workspace "{{.WORKSPACE}}" -- {{.CMD}}'
