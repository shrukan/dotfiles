[general]
live_config_reload = true
import = ["~/.config/alacritty/themes/one_dark.toml"]

[font]
size = 11
offset = { x = 0, y = 2 }

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[window]
decorations = "full"
dynamic_padding = true
